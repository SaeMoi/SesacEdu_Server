spring:
  application:
    name: SesacEdu
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

springdoc:
  swagger-ui:
    path: /swagger

app:
  security:
    jwt:
      # POST /test/jwt (테스트용 JWT 발급 API) 사용 여부. 배포 시 false 로 바꿀 것.
      test-api-enabled: true